# Dev-оверрайды. Подключаются явно: `make up-dev`
# `make up` использует только docker-compose.yml.

services:
  php:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  queue-worker:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  ws-server:
    volumes:
      - ./ws-server:/app
      - ws_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    command: sh -c "npm install && npm run dev"
    networks:
      - ws_net
      - egress_net

  nginx:
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./backend:/var/www/html:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
    depends_on:
      php:
        condition: service_healthy
      ws-server:
        condition: service_started
      frontend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: /api
      VITE_WS_URL: /ws
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    networks:
      - proxy_net
      - egress_net

volumes:
  frontend_node_modules:
  ws_node_modules:
