name: parser

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  volumes:
    - ./backend:/var/www/html
  env_file:
    - path: .env
      required: false
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-yandex_reviews}
    DB_USERNAME: ${DB_USERNAME:-app}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
    QUEUE_CONNECTION: redis
    REDIS_QUEUE_RETRY_AFTER: "300"
    SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:5173}
    WS_SERVER_URL: ${WS_SERVER_URL:-http://ws-server:6001}
    WS_INTERNAL_SECRET: ${WS_INTERNAL_SECRET:-changeme}
    COMPOSER_HOME: /tmp/composer
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - backend_net
    - egress_net

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./backend:/var/www/html:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
    depends_on:
      php:
        condition: service_healthy
      ws-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - proxy_net
      - backend_net
      - ws_net

  php:
    <<: *php
    tty: true
    stdin_open: true
    command: php-fpm
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  queue-worker:
    <<: *php
    command:
      - sh
      - -c
      - |
        until [ -f artisan ]; do
          echo "queue-worker: жду Laravel (artisan)..."
          sleep 5
        done
        exec php artisan queue:work --sleep=1 --tries=3 --backoff=60 --timeout=240
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-yandex_reviews}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app} -d ${DB_DATABASE:-yandex_reviews}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secret}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD:-secret} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend_net

  ws-server:
    build:
      context: .
      dockerfile: docker/node-ws/Dockerfile
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: ${APP_ENV:-production}
      WS_HOST: 0.0.0.0
      WS_PORT: 6001
      WS_INTERNAL_SECRET: ${WS_INTERNAL_SECRET:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ws_net
      - egress_net

volumes:
  postgres_data:
  redis_data:

networks:
  # php, postgres, redis, queue-worker; nginx тоже здесь — иначе не достучится до php-fpm.
  backend_net:
    internal: true
  # ws-server и nginx: WebSocket только через reverse proxy.
  ws_net:
    internal: true
  # единственная внешняя сеть: порты 80/443 у nginx.
  proxy_net:
  # выход в интернет для composer/npm (internal-сети его блокируют).
  egress_net:
